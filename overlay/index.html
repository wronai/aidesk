<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Desktop Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="overlay-container" id="overlay">
    <!-- Header (drag handle) -->
    <div class="header drag-handle" id="dragHandle">
      <div class="header-left">
        <span class="logo">🤖</span>
        <span class="title">AI Assistant</span>
      </div>
      <div class="header-right">
        <button class="btn-header" id="btnMoveScreen" title="Przenieś na inny ekran (Ctrl+Shift+M)">🖥️</button>
        <connection-status></connection-status>
      </div>
    </div>

    <!-- Web Components (each renders its own inner HTML) -->
    <transcript-viewer></transcript-viewer>
    <window-context></window-context>
    <screen-summary></screen-summary>
    <analysis-viewer></analysis-viewer>
    <ocr-controls></ocr-controls>
    <agent-actions></agent-actions>
    <selection-panel></selection-panel>

    <!-- Footer with stats -->
    <div class="footer" id="footer">
      <div class="footer-item">
        <span class="footer-label">📊</span>
        <span class="footer-value" id="statsText">Inicjalizacja...</span>
      </div>
      <div class="footer-item">
        <span class="footer-label">⏱️</span>
        <span class="footer-value" id="timestamp">--:--:--</span>
      </div>
    </div>

    <!-- Resize handle -->
    <div class="resize-handle" id="resizeHandle" title="Zmień rozmiar"></div>
  </div>

  <!-- Keyboard shortcuts help (initially hidden) -->
  <div class="shortcuts-help" id="shortcutsHelp" style="display: none;">
    <div class="shortcuts-title">⌨️ Skróty klawiszowe</div>
    <div class="shortcut-item">
      <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>A</kbd>
      <span>Pokaż/Ukryj</span>
    </div>
    <div class="shortcut-item">
      <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd>
      <span>Analizuj zaznaczenie</span>
    </div>
    <div class="shortcut-item">
      <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>M</kbd>
      <span>Przenieś na inny ekran</span>
    </div>
    <div class="shortcut-item">
      <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Q</kbd>
      <span>Zamknij</span>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
