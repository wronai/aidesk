<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Desktop Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="overlay-container" id="overlay">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span class="logo">🤖</span>
        <span class="title">AI Assistant</span>
      </div>
      <div class="header-right">
        <div class="status-indicator" id="connectionStatus" title="Connecting...">
          <div class="status-dot"></div>
        </div>
      </div>
    </div>

    <!-- Transcript (speech) -->
    <div class="transcript-section" id="transcriptSection" style="display: none;">
      <div class="transcript-header">🎤 Transkrypcja</div>
      <div class="transcript-text" id="transcript"></div>
    </div>

    <!-- Window Context Bar -->
    <div class="window-context" id="windowContext" style="display: none;">
      <div class="window-context-app">
        <span class="window-context-emoji" id="windowEmoji">📝</span>
        <span class="window-context-name" id="windowAppName">—</span>
        <span class="window-context-category badge" id="windowCategory">—</span>
      </div>
      <div class="window-context-detail" id="windowDetail"></div>
    </div>

    <!-- Analysis (screen) -->
    <div class="analysis-section">
      <div class="analysis-header">🖥️ Analiza ekranu</div>
      <div class="analysis-content" id="analysis">
        <div class="loading">
          <div class="loading-spinner"></div>
          <div class="loading-text">Czekam na zmiany ekranu...</div>
        </div>
      </div>
    </div>

    <!-- OCR Controls -->
    <div class="ocr-controls" id="ocrControls">
      <div class="ocr-controls-header">
        <span class="ocr-controls-title">🔤 OCR / Tryb analizy</span>
        <button class="btn-benchmark" id="btnBenchmark" title="Benchmark OCR">⚡ Test</button>
      </div>
      <div class="ocr-selectors">
        <div class="selector-group">
          <label class="selector-label">Tryb</label>
          <select id="modeSelect" class="ocr-select">
            <option value="hybrid">Hybrid (OCR→LLM)</option>
            <option value="vision_only">Vision Only</option>
            <option value="ocr_only">OCR Only</option>
            <option value="ocr_plus_vision">OCR + Vision</option>
          </select>
        </div>
        <div class="selector-group">
          <label class="selector-label">OCR Engine</label>
          <select id="ocrEngineSelect" class="ocr-select">
            <option value="paddleocr">PaddleOCR</option>
            <option value="easyocr">EasyOCR</option>
            <option value="tesseract">Tesseract</option>
          </select>
        </div>
      </div>
      <!-- Benchmark results (hidden by default) -->
      <div class="benchmark-results" id="benchmarkResults" style="display: none;"></div>
      <!-- OCR info bar -->
      <div class="ocr-info" id="ocrInfo" style="display: none;">
        <span id="ocrInfoText"></span>
      </div>
    </div>

    <!-- Agent Actions -->
    <div class="agent-actions" id="agentActions" style="display: none;">
      <div class="agent-actions-header">
        <span class="agent-actions-title">🤖 Sugerowane akcje</span>
      </div>
      <div class="agent-actions-list" id="agentActionsList"></div>
    </div>

    <!-- Footer with stats -->
    <div class="footer" id="footer">
      <div class="footer-item">
        <span class="footer-label">📊</span>
        <span class="footer-value" id="statsText">Inicjalizacja...</span>
      </div>
      <div class="footer-item">
        <span class="footer-label">⏱️</span>
        <span class="footer-value" id="timestamp">--:--:--</span>
      </div>
    </div>
  </div>

  <!-- Keyboard shortcuts help (initially hidden) -->
  <div class="shortcuts-help" id="shortcutsHelp" style="display: none;">
    <div class="shortcuts-title">⌨️ Skróty klawiszowe</div>
    <div class="shortcut-item">
      <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>A</kbd>
      <span>Pokaż/Ukryj</span>
    </div>
    <div class="shortcut-item">
      <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Q</kbd>
      <span>Zamknij</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
