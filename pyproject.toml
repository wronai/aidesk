[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxeen"
version = "2.1.38"
description = "Proxeen — AI Desktop Assistant with real-time screen analysis, voice recognition, and window context awareness."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Tom Sapletta", email = "tom@sapletta.com" }
]
requires-python = ">=3.10"
keywords = ["ai", "desktop", "assistant", "voice", "screen", "ocr", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "litellm>=1.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
proxeen = "backend.bootstrap:main"

[project.urls]
Homepage = "https://github.com/wronai/proxeen"
Repository = "https://github.com/wronai/proxeen"
Issues = "https://github.com/wronai/proxeen/issues"
Changelog = "https://github.com/wronai/proxeen/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "overlay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
